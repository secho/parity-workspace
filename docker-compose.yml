# ParityShop — the playground that gets refactored.
# Parity's own services (Postgres, platform API, platform UI) are appended here at M2.
#
# The mssql image is amd64-only. On Apple Silicon it runs under emulation; the Step 0
# smoke test measured 100k row inserts at 0.7s and 2000 procedure calls at 0.94s, so
# emulation is not a constraint for this workload.

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: parityshop-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # -C trusts the self-signed cert; mssql-tools18 requires it.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Database Mail target. sp_SyncWarehouseDispatch genuinely sends SMTP here, which is
  # what makes its `external` oracle class a property of the code rather than a label.
  # A sent mail cannot be rolled back — that is precisely why it cannot be shadowed.
  mailpit:
    image: axllent/mailpit:latest
    container_name: parityshop-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  shop-api:
    build:
      context: ./parity-platform-demo-app/monolith
    container_name: parityshop-api
    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_DATABASE: ParityShop
      PORT: "3000"
      CAPTURE_DEBUG: "${CAPTURE_DEBUG:-}"
    ports:
      # Deliberately not 3000/5173: those collide with whatever else the presenter
      # has running, and localhost resolving to IPv6 first will silently hit the
      # wrong server. A demo must not depend on who won the port race.
      - "${SHOP_API_PORT:-3100}:3000"
    volumes:
      # Source is bind-mounted so tsx watch picks up edits without a rebuild.
      - ./parity-platform-demo-app/monolith/src:/app/src:ro
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  shop-web:
    build:
      context: ./parity-platform-demo-app/web
    container_name: parityshop-web
    environment:
      SHOP_API_ORIGIN: http://shop-api:3000
    ports:
      - "${SHOP_WEB_PORT:-5180}:5173"
    volumes:
      - ./parity-platform-demo-app/web/src:/app/src:ro
      - ./parity-platform-demo-app/web/index.html:/app/index.html:ro
    depends_on:
      shop-api:
        condition: service_started

  # The migration target: sp_CalculateOrderTotal as a service, in three instances.
  #
  # `pricing-service` is M5's hand-written REFERENCE implementation, and it stays. M6 does not
  # replace it — it is the only implementation that diverges from the procedure, which makes it
  # the positive control: the standing proof that the diff engine can still find a real
  # behavioural difference. Delete it and a green shadow run stops being evidence of anything.
  #
  # `pricing-service-generated` runs what `implement-service` wrote. Same shadow database, same
  # harness, same interface — the only difference is which source is behind it, which is what
  # makes the two runs comparable.
  #
  # `pricing-service-live` runs that same generated source against the ESTATE, and is what the
  # monolith's feature flag routes to. It connects as `sa` like the monolith itself, never as
  # `parity_runner`: "Parity cannot write to the estate it analyses" is a statement about a
  # credential, and it must not acquire a footnote here.
  #
  # All three price against exactly one database, fixed at container start. A single service
  # able to choose per request would put one process in a position to write to both, and M5's
  # "the shadow connection never opens against ParityShop" would stop being an observation
  # about a connection string and become an argument about a code path.
  pricing-service:
    build:
      context: ./parity-platform-demo-app/pricing-service
    container_name: parityshop-pricing
    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      PRICING_DB: "${MSSQL_SHADOW_DATABASE:-ParityShop_Shadow}"
      PRICING_DB_USER: "${PARITY_RUNNER_USER:-parity_runner}"
      PRICING_DB_PASSWORD: "${PARITY_RUNNER_PASSWORD:-Parity_Runner_2026!}"
      PORT: "3000"
    ports:
      - "${PRICING_SERVICE_PORT:-3300}:3000"
    volumes:
      - ./parity-platform-demo-app/pricing-service/src:/app/src:ro
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  pricing-service-generated:
    build:
      context: ./parity-platform-demo-app/pricing-service-generated
    container_name: parityshop-pricing-generated
    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      PRICING_DB: "${MSSQL_SHADOW_DATABASE:-ParityShop_Shadow}"
      PRICING_DB_USER: "${PARITY_RUNNER_USER:-parity_runner}"
      PRICING_DB_PASSWORD: "${PARITY_RUNNER_PASSWORD:-Parity_Runner_2026!}"
      PORT: "3000"
    ports:
      - "${PRICING_SERVICE_GENERATED_PORT:-3301}:3000"
    volumes:
      - ./parity-platform-demo-app/pricing-service-generated/src:/app/src:ro
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      # Deliberately NOT asserting status here. Before `make adopt-service` has run there is no
      # implementation and /health says `awaiting_artifact` — an honest state, and one the
      # container has to stay up in so that adopting can be watched for.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  pricing-service-live:
    build:
      context: ./parity-platform-demo-app/pricing-service-generated
    container_name: parityshop-pricing-live
    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      # The estate, and the shop's own credential. This instance is part of ParityShop, not
      # part of Parity, so it does not borrow Parity's login to write to production.
      PRICING_DB: "${MSSQL_DATABASE:-ParityShop}"
      PRICING_DB_USER: sa
      PRICING_DB_PASSWORD: "${MSSQL_SA_PASSWORD}"
      PORT: "3000"
    ports:
      - "${PRICING_SERVICE_LIVE_PORT:-3302}:3000"
    volumes:
      - ./parity-platform-demo-app/pricing-service-generated/src:/app/src:ro
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # --- Parity, the platform -------------------------------------------------------
  #
  # Parity keeps its own state, deliberately not inside the database it analyses. It
  # reaches ParityShop over a read-only connection and never imports the demo app's code.

  parity-postgres:
    image: postgres:17-alpine
    container_name: parity-postgres
    environment:
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: parity
      POSTGRES_DB: parity
    ports:
      # 5433, not 5432: the presenter's machine already has a Postgres running.
      - "${PARITY_PG_PORT:-5433}:5432"
    volumes:
      - parity-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity -d parity"]
      interval: 5s
      timeout: 3s
      retries: 20

  parity-api:
    build:
      context: ./parity/api
    container_name: parity-api
    environment:
      PARITY_PG_URL: postgres://parity:parity@parity-postgres:5432/parity
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: ParityShop
      # db_datareader + VIEW DEFINITION, created by db/40-parity-reader.sql. Parity
      # cannot write to the estate it analyses — a permission grant rather than a promise.
      MSSQL_USER: "${PARITY_READER_USER:-parity_reader}"
      MSSQL_SA_PASSWORD: "${PARITY_READER_PASSWORD:-Parity_Reader_2026!}"
      # The one principal that may EXECUTE, used only by M4's oracle harness and always
      # inside a transaction that is rolled back. It has no DDL and is DENYed
      # sp_SyncWarehouseDispatch — a sent email cannot be rolled back, which is the same
      # reason that procedure is classified `external` and can never be shadowed.
      PARITY_RUNNER_USER: "${PARITY_RUNNER_USER:-parity_runner}"
      PARITY_RUNNER_PASSWORD: "${PARITY_RUNNER_PASSWORD:-Parity_Runner_2026!}"
      # The shadow harness replays against a restored copy, never against the estate — which
      # is what makes "production is untouched" an observation about the connection string
      # rather than an argument about transaction discipline. parity_shadow owns that copy and
      # is the only principal that can restore it; it has no user in ParityShop at all.
      MSSQL_SHADOW_DATABASE: "${MSSQL_SHADOW_DATABASE:-ParityShop_Shadow}"
      PARITY_SHADOW_USER: "${PARITY_SHADOW_USER:-parity_shadow}"
      PARITY_SHADOW_PASSWORD: "${PARITY_SHADOW_PASSWORD:-Parity_Shadow_2026!}"
      MSSQL_SHADOW_BASE_BACKUP: "${MSSQL_SHADOW_BASE_BACKUP:-/var/opt/mssql/backup/ParityShop_Shadow_base.bak}"
      # Two replay targets: the hand-written reference (the positive control) and the agent's
      # generated service (the migration target). Both against the shadow copy.
      PRICING_SERVICE_URL: http://pricing-service:3000
      GENERATED_SERVICE_URL: http://pricing-service-generated:3000
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_OWNER: "${GITHUB_OWNER:-secho}"
      GITHUB_REPO: "${GITHUB_REPO:-parity-workspace}"
      GITHUB_BASE_BRANCH: "${GITHUB_BASE_BRANCH:-main}"
      PORT: "3000"
      PARITY_MODE: "${PARITY_MODE:-live}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Point this at a LiteLLM-compatible endpoint to route through a gateway. Alza
      # already runs one; Parity is a client of a gateway and never one itself, so this
      # is the whole of the "point it at yours" change.
      ANTHROPIC_BASE_URL: "${PARITY_LLM_BASE_URL:-}"
      # Claude Platform on AWS — Anthropic-operated, AWS IAM and Marketplace billing.
      # Not Amazon Bedrock. Set CLAUDE_CODE_USE_ANTHROPIC_AWS to route through it; the
      # Agent SDK supports it natively and the model IDs are unchanged.
      CLAUDE_CODE_USE_ANTHROPIC_AWS: "${CLAUDE_CODE_USE_ANTHROPIC_AWS:-}"
      ANTHROPIC_AWS_API_KEY: "${ANTHROPIC_AWS_API_KEY:-}"
      ANTHROPIC_AWS_WORKSPACE_ID: "${ANTHROPIC_AWS_WORKSPACE_ID:-}"
      AWS_REGION: "${AWS_REGION:-}"
      # Agent run directories. Outside /app on purpose — the SDK walks UP from cwd
      # looking for .claude, and a scratch dir inside the app would inherit settings
      # the agent must not have. See docs/DECISIONS.md.
      PARITY_AGENT_WORKSPACE: /tmp/parity-agent
      PARITY_SKILLS_DIR: /app/skills
    ports:
      - "${PARITY_API_PORT:-3200}:3000"
    volumes:
      - ./parity/api/src:/app/src:ro
      - ./parity/api/drizzle:/app/drizzle:ro
      # Skills are real files. Mounted read-write-through from the host so that editing
      # one mid-demo is picked up by the next run with no rebuild — the claim "update one
      # file, every agent run sees it" has to be literally true and demonstrable.
      - ./parity/skills:/app/skills:ro
    depends_on:
      parity-postgres:
        condition: service_healthy
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  parity-web:
    build:
      context: ./parity/web
    container_name: parity-web
    environment:
      PARITY_API_ORIGIN: http://parity-api:3000
    ports:
      - "${PARITY_WEB_PORT:-5190}:5173"
    volumes:
      - ./parity/web/src:/app/src:ro
      - ./parity/web/index.html:/app/index.html:ro
    depends_on:
      parity-api:
        condition: service_started

volumes:
  mssql-data:
  parity-pg-data:
